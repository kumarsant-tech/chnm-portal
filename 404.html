<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>पेज नहीं मिला — Future Instructor CHNM</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f7fb; color: #17212f;
    }
    .card {
      width: min(560px, 100%); background: #fff; border: 1px solid #dbe4ef;
      border-radius: 18px; padding: 32px; box-shadow: 0 18px 50px rgba(16, 42, 67, .12);
      text-align: center;
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px;
      display: grid; place-items: center; color: #fff; font-weight: 800; letter-spacing: .5px;
      background: linear-gradient(135deg, #164b78, #0e7c86);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 20px; color: #58677a; line-height: 1.65; }
    .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block; padding: 10px 18px; border-radius: 10px; text-decoration: none;
      font-weight: 700; font-size: 14px; color: #fff; background: #164b78;
    }
    a.ghost { background: #eef4fa; color: #164b78; }
  </style>
<link rel="stylesheet" href="./assets/modern-ui.css?v=2">
</head>
<body>
  <main class="card">
    <div class="mark">FI</div>
    <h1>पेज नहीं मिला</h1>
    <p>आप जिस पेज को खोज रहे हैं वह उपलब्ध नहीं है या उसका पता बदल गया है। कृपया होम पेज या परीक्षा पोर्टल से आगे बढ़ें।</p>
    <div class="links">
      <a href="/index.html">होम पेज</a>
      <a class="ghost" href="/exam/index.html">छात्र पोर्टल</a>
    </div>
  </main>
<script src="./assets/modern-ui.js?v=1" defer></script>
</body>
</html>
